[package]
name = "attestr"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Promise-Theory verification: assess a turn's output against declared promises → findings + trust delta"
repository = "https://github.com/Barnett-Studios/attestr"

[dependencies]
async-trait = "0.1"
cascadr = { path = "../cascadr" }
dotclaude-support = { path = "../../crates/dotclaude-support" }
once_cell = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
