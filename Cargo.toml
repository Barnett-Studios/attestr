[package]
name = "attestr"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Promise-Theory verification: assess a turn's output against declared promises → findings + trust delta"
repository = "https://github.com/Barnett-Studios/attestr"
readme = "README.md"
keywords = ["llm", "agent", "verification", "promise-theory", "trust"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = "0.1"
# Sibling components. In the workspace these resolve to the local members; the
# standalone repo and crates.io resolve them by version (publish order:
# dotclaude-support + cascadr must be on crates.io before attestr).
cascadr = "0.1"
dotclaude-support = "0.1"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
