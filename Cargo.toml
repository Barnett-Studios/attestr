[package]
name = "attestr"
version = "0.5.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Promise-Theory verification: assess a turn's output against declared promises → findings + trust delta"
repository = "https://github.com/Barnett-Studios/attestr"
readme = "README.md"
keywords = ["llm", "agent", "verification", "promise-theory", "trust"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `cli` gates the `attestr verify` binary (ADR-0054). Off by default, so library
# consumers (e.g. dotclaude-core) pull in no extra build; the release image builds
# with `--features cli`. No extra dependencies — the CLI uses serde/serde_json only.
cli = []

# The self-contained behavioral verifier as a one-shot CLI. Only built under `--features cli`,
# so a plain `cargo build`/library consume is unchanged.
[[bin]]
name = "attestr"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
async-trait = "0.1"
# Sibling components, resolved from crates.io by version (publish order:
# baseplate + cascadr must be on crates.io before attestr).
#
# `cascadr` is not an implementation detail: `reviewer.rs` re-exports
# `ClaudeCliDispatch`, `Provider`, `Router` and friends, so this pin decides which
# version of those types attestr's own consumers receive. Holding "0.1" here while
# cascadr shipped 0.2.0 handed downstreams the struct that always passes
# `--dangerously-skip-permissions` (attestr#13). Bump it with cascadr, not later.
#
# It happened again, and the second time it blocked the whole family. cascadr 0.3.0
# (2026-09-03) and baseplate 0.3.0 (2026-09-05) shipped while this file said "0.2",
# and because cascadr's minor is the breaking position under cargo's 0.x rule, no
# lockfile update could reach them. dotclaude-core could not move either: it
# constructs `cascadr::Provider` directly AND consumes it through attestr's
# re-export, so bumping only its own pin would have linked two cascadr versions
# whose `dyn Provider` are different types. Hence dotclaude#244's red `Twin
# lockstep` on main, unfixable in dotclaude — this pin was the actual blocker.
cascadr = "0.3"
baseplate = "0.3"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
